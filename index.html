<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>No Border CMC</title>
  <meta name="description" content="No Border CMC — International bicycle messenger championship. Pay your entry or contribution.">

  <!--
    CANONICAL URL — uncomment and replace once you have a custom domain:
    <link rel="canonical" href="https://yourdomain.com">
  -->

  <!--
    FAVICON — add once you have an icon file:
    <link rel="icon" href="img/favicon.png" type="image/png">
  -->

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="screen">

    <!--
      LOGO
      Replace img/logo.png with your actual logo file.
      Keep the alt text as-is.
    -->
    <img
      src="img/logo.png"
      alt="No Border CMC"
      class="logo"
      width="320"
      height="auto"
      loading="eager"
    >

    <!--
      PAY BUTTON
      ─────────────────────────────────────────────────────────────────
      Replace YOUR_STRIPE_PAYMENT_LINK with the actual Stripe Payment
      Link URL you created in the Stripe Dashboard.

      It looks like:  https://buy.stripe.com/xxxxxxxxxxxxxxxx

      See README.md → Section E for exact instructions.
      ─────────────────────────────────────────────────────────────────
    -->
    <a
      href="YOUR_STRIPE_PAYMENT_LINK"
      class="pay-btn"
      role="button"
      aria-label="Pay — opens Stripe secure payment page"
    >
      PAY
    </a>

  </main>

</body>
</html>
